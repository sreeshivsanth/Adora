name: Adora Build & Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libxdo-dev

      - name: Install npm dependencies & Build Frontend
        run: |
          cd app
          npm ci
          npm run build

      - name: Build Desktop Binaries via Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: './app'
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'Adora ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: |
            ### Adora — Acoustic Sanctuary (${{ github.event.inputs.tag_name || github.ref_name }})
            - Zero-cost self-hosted architecture
            - Lossless audio streaming & JIT on-demand ingestion
            - Adora Blend real-time synchronized listening
            - Adora Connect cross-device remote control
            - Offline Vault storage
          releaseDraft: false
          prerelease: false
