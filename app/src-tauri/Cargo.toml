[package]
name = "adora"
version = "1.0.0"
description = "Adora — Acoustic Sanctuary Music Studio"
authors = ["Sree Shivsanth"]
edition = "2021"

[lib]
name = "adora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
